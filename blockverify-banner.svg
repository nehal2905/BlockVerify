<svg width="1280" height="340" viewBox="0 0 1280 340" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="BlockVerify — Blockchain-Powered Verification">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0B1020"/>
      <stop offset="0.55" stop-color="#161B36"/>
      <stop offset="1" stop-color="#1E1640"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7C5CFC"/>
      <stop offset="1" stop-color="#3B2E9E"/>
    </linearGradient>
    <linearGradient id="check" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34F5C5"/>
      <stop offset="1" stop-color="#10B981"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7C5CFC" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#7C5CFC" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="340" rx="20" fill="url(#bg)"/>

  <!-- faint blockchain grid of linked nodes -->
  <g opacity="0.16" stroke="#8AA0FF" stroke-width="1.4">
    <line x1="930" y1="80" x2="1030" y2="130"/>
    <line x1="1030" y1="130" x2="1150" y2="95"/>
    <line x1="1030" y1="130" x2="1080" y2="250"/>
    <line x1="1080" y1="250" x2="1180" y2="290"/>
    <line x1="1080" y1="250" x2="960" y2="280"/>
    <line x1="930" y1="80" x2="900" y2="200"/>
  </g>
  <g fill="#8AA0FF" opacity="0.5">
    <circle cx="930" cy="80" r="4"/><circle cx="1030" cy="130" r="4"/><circle cx="1150" cy="95" r="4"/>
    <circle cx="1080" cy="250" r="4"/><circle cx="1180" cy="290" r="4"/><circle cx="960" cy="280" r="4"/>
    <circle cx="900" cy="200" r="4"/>
  </g>

  <circle cx="1060" cy="170" r="150" fill="url(#glow)"/>

  <!-- Shield + verified check mark -->
  <g transform="translate(1010 92)">
    <path d="M50 0 L96 18 V70 C96 118 74 144 50 156 C26 144 4 118 4 70 V18 Z" fill="url(#shield)" stroke="#B9A8FF" stroke-width="2.5"/>
    <path d="M30 80 L46 98 L74 56" stroke="url(#check)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- Left content -->
  <g transform="translate(80 96)">
    <rect x="0" y="-2" width="46" height="4" rx="2" fill="#34F5C5"/>
    <text x="58" y="4" font-family="'Segoe UI', Inter, sans-serif" font-size="16" font-weight="700" letter-spacing="3" fill="#9FB0FF">BLOCKCHAIN-POWERED VERIFICATION</text>

    <text x="0" y="74" font-family="'Segoe UI', Inter, sans-serif" font-size="78" font-weight="800" letter-spacing="-2" fill="#FFFFFF">Block<tspan fill="#34F5C5">Verify</tspan></text>

    <text x="2" y="120" font-family="'Segoe UI', Inter, sans-serif" font-size="23" font-weight="400" fill="#C9D2F2">Issue and verify tamper-proof digital credentials.</text>
    <text x="2" y="152" font-family="'Segoe UI', Inter, sans-serif" font-size="16" font-style="italic" fill="#7C89B8">Trust, made provable.</text>
  </g>
</svg>
